<!doctype html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10233f">
  <title>Acceso al inventario | Helicenter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tema de acceso autocontenido: fija tokens Bootstrap para que la pantalla
       mantenga contraste alto sin depender del CSS de la aplicación privada. -->
  <style>
    :root {
      color-scheme: dark;
      --bs-body-color: #f5f5f5;
      --bs-body-color-rgb: 245, 245, 245;
      --bs-body-bg: #171717;
      --bs-body-bg-rgb: 23, 23, 23;
      --bs-secondary-bg: #1f1f1f;
      --bs-tertiary-bg: #262626;
      --bs-border-color: #393939;
      --bs-primary: #e23a3a;
      --bs-primary-rgb: 226, 58, 58;
      --bs-success: #7ed6a3;
      --bs-success-rgb: 126, 214, 163;
      --bs-danger: #ff8b8b;
      --bs-danger-rgb: 255, 139, 139;
      --bs-secondary-color: #b9b9b9;
      --bs-link-color: #ff6b6b;
      --bs-link-hover-color: #ff9090;
    }
    .login-page {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 82% 0%, rgb(226 58 58 / 11%), transparent 38rem),
        var(--bs-body-bg);
    }
    .login-card {
      position: relative;
      overflow: hidden;
      border-color: #393939;
      border-radius: 1.25rem;
      background: linear-gradient(155deg, #242424, #1f1f1f 55%);
      box-shadow: 0 28px 90px rgb(0 0 0 / 42%) !important;
    }
    .login-card::before {
      position: absolute;
      top: 0;
      right: 12%;
      left: 12%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #e23a3a, transparent);
      content: "";
    }
    .login-brand-logo {
      width: min(210px, 100%);
      height: auto;
    }
    .login-card h1 {
      font-weight: 700;
      letter-spacing: -.04em;
    }
    .login-card .form-label {
      color: #e8e8e8;
      font-size: .9rem;
      font-weight: 600;
    }
    .login-card .form-control {
      min-height: 46px;
      border-color: #414141;
      border-radius: .75rem;
      background: #181818;
      color: #f5f5f5;
    }
    .login-card .form-control:focus {
      border-color: #e23a3a;
      box-shadow: 0 0 0 .25rem rgb(226 58 58 / 16%);
    }
    .btn-primary {
      --bs-btn-color: #fff;
      --bs-btn-bg: #e23a3a;
      --bs-btn-border-color: #e23a3a;
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: #c92d2d;
      --bs-btn-hover-border-color: #c92d2d;
      border-radius: .75rem;
      font-weight: 700;
      transition: transform .18s ease, background-color .18s ease;
    }
    .btn-primary:hover { transform: translateY(-1px); }
    @media (prefers-reduced-motion: reduce) {
      .btn-primary { transition: none; }
      .btn-primary:hover { transform: none; }
    }
  </style>
</head>
<body class="login-page">
  <!-- Estructura principal semántica y centrada; los campos tienen etiquetas
       explícitas/autocompletado y los errores se anuncian sin recargar la página. -->
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <section class="card login-card border shadow-lg">
          <div class="card-body p-4 p-sm-5">
            <a class="d-block text-center mb-4" href="/login" aria-label="Helicenter">
              <img
                class="img-fluid login-brand-logo"
                src="/assets/images/logo/logo_helicenter.png"
                alt="Helicenter · Mantenimiento de Helicópteros">
            </a>
            <h1 class="h3 mb-2">Acceso al inventario</h1>
            <p class="text-body-secondary mb-4">Inicia sesión con tu cuenta autorizada para gestionar el inventario.</p>
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input
                  class="form-control"
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  maxlength="254"
                  required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input
                  class="form-control"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required>
              </div>
              <button class="btn btn-primary w-100" id="submit-button" type="submit">Ingresar</button>
              <p class="small text-danger mt-3 mb-0" id="login-error" role="alert" aria-live="polite"></p>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
  <!-- La lógica de autenticación usa fetch y recibe la cookie segura del servidor. -->
  <script type="module" src="/js/login.js"></script>
</body>
</html>
